services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: living-town-falkordb
    ports:
      - "6381:6379"   # Redis protocol (host 6381)
      - "3001:3000"   # FalkorDB Browser UI
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    restart: unless-stopped

volumes:
  falkordb-data:
