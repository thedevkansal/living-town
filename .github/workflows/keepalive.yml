name: keepalive

# Render's free tier sleeps after ~15 idle minutes and a free FalkorDB Cloud instance pauses when unused.
# /api/health pings FalkorDB, so frequent pings keep both awake for the judges. The backend also pings its own public URL every 10 minutes.
on:
  schedule:
    - cron: "3-58/5 * * * *"   # every 5 min at :03, :08, ... (GitHub may delay scheduled runs; the app also pings itself)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the live site (and through it, FalkorDB)
        run: |
          for attempt in 1 2 3; do
            body=$(curl -fsS --max-time 90 https://living-town.onrender.com/api/health) && echo "$body" && \
              echo "$body" | grep -q '"db":true' && exit 0
            echo "attempt $attempt failed, retrying in 20s"; sleep 20
          done
          exit 1
